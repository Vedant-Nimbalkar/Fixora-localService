<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pay for Booking — Fixora</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #F9FAFB;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .card {
      background: #fff;
      border: 1px solid #E5E7EB;
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 24rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      text-align: center;
    }
    .icon {
      width: 3.5rem; height: 3.5rem;
      border-radius: 1rem;
      background: linear-gradient(135deg, #2563EB, #7C3AED);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.25rem;
      box-shadow: 0 6px 18px rgba(37,99,235,0.3);
    }
    .icon svg { width: 1.75rem; height: 1.75rem; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    h2 { font-size: 1.5rem; font-weight: 800; color: #111827; margin-bottom: 0.375rem; }
    .sub { font-size: 0.875rem; color: #6B7280; margin-bottom: 2rem; }
    .amount-box {
      background: #EFF6FF;
      border: 1px solid #BFDBFE;
      border-radius: 0.75rem;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .amount-label { font-size: 0.75rem; color: #6B7280; margin-bottom: 0.25rem; }
    .amount-value { font-size: 2rem; font-weight: 800; color: #1D4ED8; }
    .info-row {
      display: flex; justify-content: space-between;
      font-size: 0.8125rem; color: #374151;
      padding: 0.5rem 0;
      border-bottom: 1px solid #F3F4F6;
    }
    .info-row span:last-child { font-weight: 600; color: #111827; }
    .info-rows { margin-bottom: 1.75rem; }
    .btn-pay {
      width: 100%;
      padding: 0.875rem;
      background: linear-gradient(135deg, #2563EB, #7C3AED);
      color: #fff;
      border: none;
      border-radius: 0.625rem;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37,99,235,0.35);
      transition: opacity 0.2s, transform 0.2s;
    }
    .btn-pay:hover { opacity: 0.9; transform: translateY(-1px); }
    .secure-note {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #9CA3AF;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
    }
    .secure-note svg { width: 0.875rem; height: 0.875rem; stroke: #9CA3AF; fill: none; stroke-width: 2; }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
    </div>
    <h2>Complete Payment</h2>
    <p class="sub">Secure payment powered by Razorpay</p>

    <div class="amount-box">
      <p class="amount-label">Amount to Pay</p>
      <p class="amount-value">₹500</p>
    </div>

    <div class="info-rows">
      <div class="info-row">
        <span>Booking ID</span>
        <span th:text="'#' + ${bookingId}">—</span>
      </div>
      <div class="info-row">
        <span>Service</span>
        <span th:text="${serviceType}">—</span>
      </div>
      <div class="info-row">
        <span>Date</span>
        <span th:text="${bookingDate}">—</span>
      </div>
      <div class="info-row">
        <span>Time Slot</span>
        <span th:text="${timeSlot}">—</span>
      </div>
    </div>

    <button class="btn-pay" onclick="startPayment()">Pay ₹500 Now</button>

    <p class="secure-note">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Secured by Razorpay
    </p>
  </div>

  <!-- Razorpay SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <script th:inline="javascript">
    const bookingId = [[${bookingId}]];

    async function startPayment() {
      // Step 1: Create order from backend
      const res = await fetch('/payment/create-order/' + bookingId, {
        method: 'POST'
      });
      const orderData = await res.json();

      if (orderData.error) {
        alert('Failed to create order: ' + orderData.error);
        return;
      }

      // Step 2: Open Razorpay popup
      const options = {
        key: orderData.keyId,
        amount: orderData.amount,
        currency: orderData.currency,
        name: 'Fixora',
        description: 'Service Booking Payment',
        order_id: orderData.orderId,
        handler: async function (response) {
          // Step 3: Verify payment on backend
          const verifyRes = await fetch('/payment/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              razorpay_order_id:   response.razorpay_order_id,
              razorpay_payment_id: response.razorpay_payment_id,
              razorpay_signature:  response.razorpay_signature,
              bookingId:           String(bookingId)
            })
          });

          const verifyData = await verifyRes.json();

          if (verifyData.success) {
            alert('Payment successful! Your booking is confirmed.');
            window.location.href = '/my-bookings';
          } else {
            alert('Payment verification failed. Please contact support.');
          }
        },
        prefill: {
          name:  orderData.customerName,
          email: orderData.userEmail
        },
        theme: { color: '#2563EB' }
      };

      const rzp = new Razorpay(options);
      rzp.open();
    }
  </script>

</body>
</html>
